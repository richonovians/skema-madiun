# Reverse proxy PENGEMBANGAN — menyatukan frontend & backend di SATU origin.
#
# KENAPA ADA (2026-08-27): SSO Helpdesk menuntut satu `redirect_uri` yang
# didaftarkan dan tetap. Menyatukan keduanya di satu domain berarti:
#   - cookie sesi `session` jadi same-origin → `SESSION_COOKIE_DOMAIN` tak perlu
#     diisi, dan cookie tak pernah bocor ke subdomain lain;
#   - CORS hilang sama sekali (tak ada permintaan lintas-origin lagi);
#   - bentuk konfigurasi PENGEMBANGAN sama dengan PRODUKSI, sehingga jalur cookie
#     yang dipakai produksi benar-benar teruji, bukan cabang kode yang mati di dev.
#
# `api` & `web` dijalankan di HOST (pnpm dev), bukan di dalam container — karena
# itu upstream-nya `host.docker.internal`, bukan nama service compose. Ini memang
# berkas dev: Turbopack/HMR jauh lebih cepat di host daripada lewat bind mount.
#
# Padanan produksi ada di berkas sebelah, `prod.conf`: aturan yang SAMA, hanya
# `listen 443 ssl` + sertifikat, upstream menunjuk container `api`/`web`, dan
# `/api/docs` ditutup 404. Perubahan pada salah satu berkas biasanya perlu
# dicerminkan di berkas lainnya.

# `host.docker.internal` disediakan Docker Desktop dan menunjuk ke IPv4 host
# (192.168.65.254 di mesin ini) -- SATU alamat, dan itu penting.
#
# JANGAN menambahkan `extra_hosts: host.docker.internal:host-gateway` di
# docker-compose.yml (2026-08-27, sudah pernah dicoba dan merusak): baris itu
# MENUMPUK entri kedua di atas milik Docker Desktop, dan di Docker Desktop
# `host-gateway` justru alamat IPv6 (fdc4:...::254) yang "Network unreachable"
# dari dalam container. nginx lalu bergilir ke alamat mati itu, menandai upstream
# "temporarily disabled", dan mencoba ulang ke alamat yang hidup. Untuk permintaan
# biasa percobaan ulang itu selamat, TAPI untuk jabat-tangan WebSocket ia
# menghasilkan "upstream sent no valid HTTP/1.0 header" -- HMR mati dan halaman
# TAK PERNAH TERHIDRASI walau HTML-nya tetap 200. Gejalanya menyesatkan: halaman
# tampak termuat, cuma tak ada satu pun efek React yang jalan.
#
# Di Docker Engine Linux (bukan Desktop) nama ini tak ada; di sana barulah
# tambahkan extra_hosts tersebut -- dan hanya di sana.
upstream skm_api {
    server host.docker.internal:3001;
}

upstream skm_web {
    server host.docker.internal:3000;
}

# HMR Next.js memakai WebSocket. Tanpa peta ini header `Connection` diteruskan
# apa adanya dan peningkatan protokolnya gagal — halaman tetap tampil, tapi
# setiap simpan berkas tak pernah tercermin di peramban.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # `localhost` ikut diterima supaya http://localhost (tanpa port) juga bekerja
    # bagi yang belum menambahkan entri hosts.
    server_name skema.local localhost;

    # Lampiran pengaduan boleh besar; batas bawaan nginx 1 MB akan menolaknya
    # dengan 413 sebelum permintaan sempat mencapai ValidationPipe.
    client_max_body_size 25m;

    # --- BACKEND (NestJS) ---
    # Mencakup /api/v1/* dan /api/docs (Swagger) sekaligus. Frontend tidak punya
    # rute /api sendiri, jadi tak ada tabrakan.
    location /api/ {
        proxy_pass http://skm_api;
        proxy_http_version 1.1;

        # `$host` (bukan nilai tetap) supaya backend melihat domain yang benar-benar
        # diminta peramban — itulah yang harus cocok dengan `redirect_uri`.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lampiran pengaduan yang disajikan API sebagai berkas statis.
    location /uploads/ {
        proxy_pass http://skm_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- FRONTEND (Next.js) ---
    # Paling akhir & paling umum: apa pun yang bukan milik backend adalah halaman.
    location / {
        proxy_pass http://skm_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket HMR — lihat catatan pada `map` di atas.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Penyangga dimatikan: Next.js dev mengalirkan RSC & pesan HMR sedikit-
        # sedikit, dan penyangga nginx menahannya sampai penuh sehingga halaman
        # terasa menggantung.
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
}
