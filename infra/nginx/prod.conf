# Reverse proxy PRODUKSI — satu origin untuk frontend & backend.
#
# Aturannya sama dengan dev.conf; yang berbeda hanya empat hal, dan tiga di
# antaranya bukan pilihan gaya melainkan keharusan:
#
#   1. TLS. Sejak sesi pindah ke cookie HttpOnly, `SessionCookieService` memasang
#      atribut `Secure` begitu NODE_ENV=production. Peramban MEMBUANG cookie
#      `Secure` yang datang lewat http:// tanpa pesan apa pun -- backend akan
#      melaporkan login sukses sementara pengguna tetap dianggap belum masuk, dan
#      gejalanya tak menunjuk ke mana pun. Jadi tanpa berkas ini + sertifikat,
#      SSO produksi bukan "kurang rapi" tapi tidak berfungsi.
#   2. Upstream menunjuk nama service compose (`api`, `web`), bukan
#      `host.docker.internal` -- di produksi keduanya berjalan DI DALAM jaringan
#      compose, bukan di host.
#   3. `/api/docs` ditutup. Di dev ia ikut lolos lewat `location /api/`; di
#      produksi itu berarti seluruh permukaan API terpampang tanpa autentikasi.
#      Ditutup di DUA tempat dengan sengaja: di sini dan lewat
#      `SWAGGER_ENABLED=false` di env. Satu lapis saja terlalu mudah hilang saat
#      seseorang menyalin berkas ini.
#   4. Tak ada urusan HMR. Tak ada `map $http_upgrade` dan tak ada header
#      `Upgrade` -- WebSocket hanya dipakai Turbopack di dev. Penyangga TETAP
#      dimatikan untuk halaman, karena App Router mengalirkan RSC secara bertahap
#      di produksi juga; menyangganya membuat halaman terasa menggantung.
#
# ASUMSI YANG HARUS DISESUAIKAN SAAT DEPLOY (belum dapat diverifikasi dari sini):
#   - Nama domain `skema.madiunkab.go.id` -- harus sama persis dengan
#     `WEB_APP_URL` dan awalan `HELPDESK_SSO_REDIRECT_URI` di .env, dan sama
#     persis dengan yang didaftarkan di SSO Helpdesk. Pencocokan Helpdesk PERSIS.
#   - Letak sertifikat di /etc/nginx/certs/. Bila memakai Let's Encrypt/certbot,
#     ganti ke /etc/letsencrypt/live/<domain>/fullchain.pem & privkey.pem.
#     Bila sertifikatnya terbitan pemkab, gabungkan sertifikat server + rantai
#     antara menjadi satu berkas fullchain -- nginx tak menyusunnya sendiri, dan
#     rantai yang tak lengkap gagal HANYA di sebagian klien (Android lebih rewel
#     daripada peramban desktop), jadi mudah lolos dari pengujian sepintas.

upstream skm_api {
    server api:3001;
}

upstream skm_web {
    server web:3000;
}

# HTTP hanya untuk mengantar ke HTTPS. TIDAK melayani aplikasi sama sekali:
# melayaninya di http berarti cookie `Secure` hilang diam-diam (lihat catatan 1).
server {
    listen 80;
    listen [::]:80;
    server_name skema.madiunkab.go.id;

    # Dibiarkan lewat: certbot menaruh berkas tantangannya di sini, dan
    # mengalihkannya ke https membuat pembaruan sertifikat gagal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name skema.madiunkab.go.id;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Hanya TLS 1.2 & 1.3. TLS 1.0/1.1 sudah ditarik dan menyisakannya tak
    # menambah jangkauan klien yang berarti.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS TIDAK dipasang di sini: helmet() (app.setup.ts) sudah memasangnya pada
    # setiap respons backend, dan Next.js pada responsnya sendiri. Menambahkannya
    # di nginx menghasilkan header ganda pada sebagian respons -- sebagian klien
    # menolak header Strict-Transport-Security yang muncul dua kali, sehingga
    # niat mengeraskan justru melemahkannya. Bila kelak helmet dilepas, barulah
    # pindahkan ke sini.

    # Lampiran pengaduan boleh besar; batas bawaan nginx 1 MB akan menolaknya
    # dengan 413 sebelum permintaan sempat mencapai ValidationPipe.
    client_max_body_size 25m;

    # --- Swagger DITUTUP (lihat catatan 3) ---
    # Sebelum `location /api/`, karena prefiks yang lebih panjang menang hanya
    # untuk pencocokan literal -- dan justru itu yang diandalkan di sini.
    location /api/docs {
        return 404;
    }

    # --- BACKEND (NestJS) ---
    location /api/ {
        proxy_pass http://skm_api;
        proxy_http_version 1.1;

        # `$host` (bukan nilai tetap) supaya backend melihat domain yang
        # benar-benar diminta peramban -- itulah yang harus cocok dengan
        # `redirect_uri` terdaftar.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # WAJIB, dan `$proxy_add_x_forwarded_for` (bukan `$remote_addr`) dengan
        # sengaja: ia MENAMBAHKAN IP asli di ujung kanan daftar, sehingga nilai
        # yang dikarang klien terlewati oleh `TRUST_PROXY_HOPS=1` di sisi
        # Express. Menuliskannya `$remote_addr` juga aman, tapi kehilangan jejak
        # proxy yang sah; menghilangkannya sama sekali membuat batas laju
        # menghitung SELURUH pengguna sebagai satu IP.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Menentukan `req.protocol`/`req.secure` di Express. Harus ada agar
        # backend tahu koneksinya https walau ia sendiri melayani http.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lampiran pengaduan yang disajikan API sebagai berkas statis.
    location /uploads/ {
        proxy_pass http://skm_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- FRONTEND (Next.js) ---
    # Paling akhir & paling umum: apa pun yang bukan milik backend adalah halaman.
    location / {
        proxy_pass http://skm_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # App Router mengalirkan RSC bertahap di produksi juga -- lihat catatan 4.
        proxy_buffering off;
    }
}
