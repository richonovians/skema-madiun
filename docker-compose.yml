# Docker Compose — environment DEVELOPMENT
#
# Saat ini hanya menjalankan PostgreSQL. Service `api` (NestJS) dan `web`
# (Next.js) ditambahkan pada langkah berikutnya dengan menempel ke `network`
# dan pola `depends_on` yang sudah disiapkan di bawah — tanpa mengubah
# arsitektur network/volume.

name: skm-spm

services:
  db:
    image: postgres:18-alpine
    container_name: skm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-skm_db}
      # Sejak image postgres:18, default PGDATA pindah ke /var/lib/postgresql/18/docker.
      # Dikunci ke path lama agar tetap jatuh di dalam volume `postgres-data` di bawah —
      # tanpa ini data ditulis ke layer container dan hilang saat `compose down`.
      PGDATA: /var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - skm-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-skm} -d ${POSTGRES_DB:-skm_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Reverse proxy pengembangan — menyatukan frontend (:3000) & backend (:3001)
  # di SATU origin `http://skema.local`, sehingga bentuknya sama dengan produksi
  # dan `redirect_uri` SSO Helpdesk tetap satu alamat. Alasan lengkap + aturan
  # rute ada di infra/nginx/dev.conf.
  #
  # Butuh satu langkah manual sekali saja (berkas hosts):
  #   127.0.0.1 skema.local
  # Windows: C:\Windows\System32\drivers\etc\hosts (WAJIB run-as-administrator)
  proxy:
    image: nginx:1.29-alpine
    container_name: skm-proxy
    restart: unless-stopped
    ports:
      - '${PROXY_PORT:-80}:80'
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    # `api` & `web` berjalan di HOST (pnpm dev), bukan sebagai container, jadi
    # nginx menunjuk ke `host.docker.internal` yang sudah disediakan Docker
    # Desktop.
    #
    # SENGAJA TANPA `extra_hosts` -- lihat peringatan panjang di
    # infra/nginx/dev.conf. Menambahkan `host.docker.internal:host-gateway` di
    # sini justru mematikan HMR & hidrasi React di Docker Desktop. Baris itu
    # hanya diperlukan pada Docker Engine Linux.
    networks:
      - skm-network

  # ---------------------------------------------------------------------------
  # PLACEHOLDER — belum aktif (sengaja dikomentari).
  # Ditambahkan pada langkah scaffolding NestJS/Next.js. Struktur network,
  # dependency healthcheck, dan variabel port sudah disiapkan agar cukup
  # meng-uncomment + menambah Dockerfile, tanpa mengubah bagian lain.
  #
  # api:
  #   build:
  #     context: .
  #     dockerfile: infra/docker/api.Dockerfile
  #   container_name: skm-api
  #   restart: unless-stopped
  #   env_file: .env
  #   depends_on:
  #     db:
  #       condition: service_healthy   # api menunggu DB benar-benar siap
  #   ports:
  #     - '${API_PORT:-3001}:3001'
  #   networks:
  #     - skm-network
  #
  # web:
  #   build:
  #     context: .
  #     dockerfile: infra/docker/web.Dockerfile
  #   container_name: skm-web
  #   restart: unless-stopped
  #   depends_on:
  #     - api
  #   ports:
  #     - '${WEB_PORT:-3000}:3000'
  #   networks:
  #     - skm-network
  # ---------------------------------------------------------------------------

volumes:
  postgres-data:
    name: skm-postgres-data

networks:
  skm-network:
    name: skm-network
    driver: bridge
